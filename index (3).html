<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    background-image:

      url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27220%27%20height=%27220%27%20viewBox=%270%200%20220%20220%27%3E%3Cg%20transform=%27translate%2840%2040%29%20rotate%28-30%29%27%3E%3Cellipse%20rx=%2720%27%20ry=%2728%27%20fill=%27%236b3d24%27/%3E%3Cpath%20d=%27M0%20-26%20C-8%20-9%208%209%200%2026%27%20stroke=%27%232a140c%27%20stroke-width=%274%27%20fill=%27none%27%20stroke-linecap=%27round%27/%3E%3C/g%3E%3Cg%20transform=%27translate%28150%2055%29%20rotate%2825%29%27%3E%3Cellipse%20rx=%2720%27%20ry=%2728%27%20fill=%27%2358311d%27/%3E%3Cpath%20d=%27M0%20-26%20C-8%20-9%208%209%200%2026%27%20stroke=%27%232a140c%27%20stroke-width=%274%27%20fill=%27none%27%20stroke-linecap=%27round%27/%3E%3C/g%3E%3Cg%20transform=%27translate%2895%20150%29%20rotate%2870%29%27%3E%3Cellipse%20rx=%2720%27%20ry=%2728%27%20fill=%27%2377462b%27/%3E%3Cpath%20d=%27M0%20-26%20C-8%20-9%208%209%200%2026%27%20stroke=%27%232a140c%27%20stroke-width=%274%27%20fill=%27none%27%20stroke-linecap=%27round%27/%3E%3C/g%3E%3Cg%20transform=%27translate%28190%20185%29%20rotate%28-15%29%27%3E%3Cellipse%20rx=%2720%27%20ry=%2728%27%20fill=%27%2363371f%27/%3E%3Cpath%20d=%27M0%20-26%20C-8%20-9%208%209%200%2026%27%20stroke=%27%232a140c%27%20stroke-width=%274%27%20fill=%27none%27%20stroke-linecap=%27round%27/%3E%3C/g%3E%3Cg%20transform=%27translate%28105%2038%29%20rotate%2835%29%27%3E%3Cpath%20d=%27M0%20-27%20C15%20-14%2015%2014%200%2027%20C-15%2014%20-15%20-14%200%20-27Z%27%20fill=%27%239bb35f%27/%3E%3Cpath%20d=%27M0%20-25%20L0%2025%20M-6%20-17%20C-10%20-5%20-10%205%20-6%2017%20M6%20-17%20C10%20-5%2010%205%206%2017%27%20stroke=%27%235e7a2f%27%20stroke-width=%271.8%27%20fill=%27none%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M0%20-27%20L0%20-31%27%20stroke=%27%235e7a2f%27%20stroke-width=%273%27%20stroke-linecap=%27round%27/%3E%3C/g%3E%3Cg%20transform=%27translate%2835%20120%29%20rotate%28-40%29%27%3E%3Cpath%20d=%27M0%20-27%20C15%20-14%2015%2014%200%2027%20C-15%2014%20-15%20-14%200%20-27Z%27%20fill=%27%2386a04c%27/%3E%3Cpath%20d=%27M0%20-25%20L0%2025%20M-6%20-17%20C-10%20-5%20-10%205%20-6%2017%20M6%20-17%20C10%20-5%2010%205%206%2017%27%20stroke=%27%2352702a%27%20stroke-width=%271.8%27%20fill=%27none%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M0%20-27%20L0%20-31%27%20stroke=%27%2352702a%27%20stroke-width=%273%27%20stroke-linecap=%27round%27/%3E%3C/g%3E%3Cg%20transform=%27translate%28165%20125%29%20rotate%2860%29%27%3E%3Cpath%20d=%27M0%20-27%20C15%20-14%2015%2014%200%2027%20C-15%2014%20-15%20-14%200%20-27Z%27%20fill=%27%23a6bd6a%27/%3E%3Cpath%20d=%27M0%20-25%20L0%2025%20M-6%20-17%20C-10%20-5%20-10%205%20-6%2017%20M6%20-17%20C10%20-5%2010%205%206%2017%27%20stroke=%27%235e7a2f%27%20stroke-width=%271.8%27%20fill=%27none%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M0%20-27%20L0%20-31%27%20stroke=%27%235e7a2f%27%20stroke-width=%273%27%20stroke-linecap=%27round%27/%3E%3C/g%3E%3Cg%20transform=%27translate%2860%20195%29%20rotate%2815%29%27%3E%3Cpath%20d=%27M0%20-27%20C15%20-14%2015%2014%200%2027%20C-15%2014%20-15%20-14%200%20-27Z%27%20fill=%27%238fa855%27/%3E%3Cpath%20d=%27M0%20-25%20L0%2025%20M-6%20-17%20C-10%20-5%20-10%205%20-6%2017%20M6%20-17%20C10%20-5%2010%205%206%2017%27%20stroke=%27%2352702a%27%20stroke-width=%271.8%27%20fill=%27none%27%20stroke-linecap=%27round%27/%3E%3Cpath%20d=%27M0%20-27%20L0%20-31%27%20stroke=%27%2352702a%27%20stroke-width=%273%27%20stroke-linecap=%27round%27/%3E%3C/g%3E%3C/svg%3E");
    background-size:cover,220px 220px;background-attachment:fixed;
    display:flex;align-items:center;justify-content:center;
    padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
  }
  main{
    position:relative;width:100%;max-width:580px;text-align:center;
    padding:46px 28px 38px;
    background:linear-gradient(180deg,rgba(40,22,14,.82),rgba(22,12,8,.88));
    border:1px solid rgba(217,163,95,.55);border-radius:32px;
    box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 0 60px rgba(217,163,95,.07);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    animation:rise .9s ease-out both;
  }
  main::before{content:"";position:absolute;inset:9px;border:1px solid rgba(217,163,95,.22);border-radius:24px;pointer-events:none}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .cup{width:128px;height:128px;margin:0 auto 6px;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
  .steam{fill:none;stroke:#f3dcb8;stroke-width:3;stroke-linecap:round;opacity:0;animation:steam 3.2s ease-in-out infinite}
  .s2{animation-delay:1s}.s3{animation-delay:2s}
  @keyframes steam{0%{opacity:0;transform:translateY(8px)}35%{opacity:.75}100%{opacity:0;transform:translateY(-10px)}}
  h1{
    font-family:'Aref Ruqaa',serif;font-weight:700;
    font-size:clamp(3rem,12vw,4.8rem);line-height:1.25;
    background:linear-gradient(180deg,#fbe6c2 10%,#d9a35f 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.55));
  }
  .orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px auto 18px;max-width:300px}
  .orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .orn i:last-child{transform:scaleX(-1)}
  .orn svg{width:26px;height:26px}
  .welcome{
    font-family:'Aref Ruqaa',serif;font-size:clamp(1.3rem,5vw,1.85rem);
    line-height:2.1;color:var(--milk);max-width:26em;margin:0 auto;
  }
  .welcome span{display:block}
  .welcome span+span{color:var(--crema)}
  .sub{margin:16px auto 0;font-size:1.02rem;line-height:1.9;color:rgba(251,241,227,.72);max-width:24em}
  .cta{
    display:inline-flex;align-items:center;gap:10px;margin-top:28px;
    padding:14px 30px;border-radius:999px;text-decoration:none;
    font-weight:500;font-size:1.08rem;color:#0f2b17;
    background:linear-gradient(180deg,#46e283,#1fb457);
    box-shadow:0 10px 24px rgba(37,211,102,.28);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .cta svg{width:22px;height:22px;fill:#0f2b17}
  .cta:hover,.cta:focus-visible{transform:translateY(-3px);box-shadow:0 14px 30px rgba(37,211,102,.4)}
  .follow{font-size:1.05rem;color:var(--crema);margin:34px 0 18px}
  .social{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;list-style:none;padding:0}
  .social a{display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--milk);text-decoration:none;font-size:.95rem}
  .ico{
    width:70px;height:70px;border-radius:22px;display:grid;place-items:center;
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 8px 20px rgba(0,0,0,.5);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .social a:hover .ico,.social a:focus-visible .ico{transform:translateY(-6px) scale(1.07)}
  .social a:focus-visible,.cta:focus-visible{outline:3px solid var(--gold);outline-offset:5px}
  .ico svg{width:34px;height:34px;fill:#fff}
  .insta{background:linear-gradient(45deg,#feda75,#fa7e1e 30%,#d62976 60%,#962fbf 80%,#4f5bd5)}
  .tiktok{background:#000}
  .whats{background:#25d366}
  .social a:hover .insta{box-shadow:0 10px 26px rgba(214,41,118,.55)}
  .social a:hover .tiktok{box-shadow:0 10px 26px rgba(37,244,238,.4),0 6px 22px rgba(254,44,85,.4)}
  .social a:hover .whats{box-shadow:0 10px 26px rgba(37,211,102,.55)}
  footer{margin-top:36px;font-size:.88rem;color:rgba(251,241,227,.6)}
  @media (prefers-reduced-motion:reduce){main{animation:none}.steam{animation:none;opacity:.5}.ico,.cta{transition:none}}
</style>
</head>
<body>
<main>

    <path class="steam s1" d="M44 38c-7-8 7-12 0-22"/><path class="steam s2" d="M58 38c-7-8 7-12 0-22"/><path class="steam s3" d="M72 38c-7-8 7-12 0-22"/>

    <ellipse cx="59" cy="108" rx="44" ry="7" fill="#e9c9a0"/><ellipse cx="59" cy="106" rx="30" ry="4" fill="#d9a35f"/>

  <h1>باريستا كافيه</h1>

    </li>
    <li>

        <span class="ico tiktok"><svg viewBox="0 0 24 24">
          <path fill="#25f4ee" transform="translate(-1 -1)" d="M16.6 2h-3.2v13.2a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9.1a6.1 6.1 0 1 0 5.2 6V8.6a7.6 7.6 0 0 0 4.4 1.4V6.8a4.5 4.5 0 0 1-4.4-4.8z"/>

<script>
  // فتح التطبيقات مباشرة من الموبايل. على الكمبيوتر تفتح الروابط العادية.
  (function(){
    var ua = navigator.userAgent, android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
    if(!android && !ios) return;
    function intent(path, scheme, pkg, fallback){
      return 'intent://' + path + '#Intent;scheme=' + scheme + ';package=' + pkg +
             ';S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
    }
    document.querySelectorAll('.social a').forEach(function(a){
      var url = a.href, m, target = null;
      if((m = url.match(/instagram\.com\/([^\/?#]+)/))){
        target = android ? intent('instagram.com/_u/' + m[1] + '/', 'https', 'com.instagram.android', url)
                         : 'https://www.instagram.com/_u/' + m[1];
      } else if((m = url.match(/wa\.me\/qr\/([^\/?#]+)/))){
        target = android ? intent('wa.me/qr/' + m[1], 'https', 'com.whatsapp', url) : url;
      } else if((m = url.match(/wa\.me\/([^\/?#]+)/))){
        target = android ? intent('send?phone=' + m[1], 'whatsapp', 'com.whatsapp', url) : url;
      }
      if(target) a.addEventListener('click', function(e){ e.preventDefault(); window.location.href = target; });
    });
  })();
</script>
